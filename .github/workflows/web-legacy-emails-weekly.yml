# Web Legacy Emails — weekly Jira summary email (see web_legacy_emails/GO_LIVE_GUIDE.html and
# web_legacy_emails/WEB_LEGACY_EMAILS_SOP.md, section 6d).
#
# Repository settings (Settings → Secrets and variables → Actions):
#   Secrets   : JIRA_API_TOKEN, GMAIL_APP_PASSWORD            (encrypted, masked in logs)
#   Variables : EMAIL_TO, EMAIL_CC                            (override To/CC in jira_config.json when set)
#               JIRA_EMAIL, GMAIL_USER                        (may also be stored as secrets)
#               WEEKLY_EMAIL_ENABLED = true                   (turns ON scheduled sending; manual runs always work)
#               SEND_DAYS  = Fri                              (days to send, e.g. "Fri" or "Mon,Fri"; default Fri)
#               SEND_TIME  = 17:30                            (IST, 24-hour; default 17:30)
#               SCHEDULE_MODE = send                          ("test" = scheduled runs send [TEST] only to GMAIL_USER, no history)
#
# Day and time are VARIABLES — change them on GitHub, never in this file. GitHub's cron cannot read
# variables (and is often late), so this workflow wakes every 30 minutes between 15:30 and 00:00 IST and
# a quick check decides whether to send: today is a SEND_DAYS day, the IST time is at/after SEND_TIME,
# and nothing was sent today yet (last_scheduled_send.json). The first wake-up that qualifies sends;
# the rest of the day is skipped. Do not edit the cron line below unless you need a different window.
#
# Manual run: Actions → "Web Legacy Emails – Weekly Summary" → Run workflow → mode
#   test    = send only to the Gmail account itself, history untouched (default)
#   dry-run = build the email, send nothing; download the preview from the run's artifacts
#   send    = real send to To/CC, save the week to history and mark today as sent
name: Web Legacy Emails – Weekly Summary

on:
  schedule:
    # Wake-up window, NOT the send time: every 30 min, 10:00–18:30 UTC = 15:30–00:00 IST
    - cron: '0,30 10-18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = only to the Gmail account · dry-run = build only · send = real send + save history'
        type: choice
        options: [test, dry-run, send]
        default: test

permissions:
  contents: write   # commit history + the "sent today" marker back

concurrency:
  group: web-legacy-emails-weekly
  cancel-in-progress: false

jobs:
  weekly-summary:
    # Scheduled wake-ups only when explicitly enabled (otherwise skipped at no cost); manual runs always allowed
    if: github.event_name == 'workflow_dispatch' || vars.WEEKLY_EMAIL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kolkata   # SEND_TIME, the week date and "Week of …" all use IST
    steps:
      # Latest commit on the branch (not the triggering one) so a queued run sees today's marker
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Is a send due now?
        id: due
        env:
          SEND_DAYS: ${{ vars.SEND_DAYS }}
          SEND_TIME: ${{ vars.SEND_TIME }}
          SCHEDULE_MODE: ${{ vars.SCHEDULE_MODE || 'send' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — always runs."
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            node web_legacy_emails/send_weekly.js --check-due
          fi

      - uses: actions/setup-node@v4
        if: steps.due.outputs.due == 'true'
        with:
          node-version: '24'
          cache: npm

      - if: steps.due.outputs.due == 'true'
        run: npm ci

      - name: Send weekly summary
        if: steps.due.outputs.due == 'true'
        env:
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL || secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GMAIL_USER: ${{ vars.GMAIL_USER || secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_CC: ${{ vars.EMAIL_CC }}
          # Scheduled runs: SCHEDULE_MODE (default send). Manual runs: the chosen mode.
          MODE: ${{ github.event_name == 'schedule' && (vars.SCHEDULE_MODE || 'send') || inputs.mode }}
        run: |
          echo "Mode: $MODE (trigger: ${{ github.event_name }})"
          case "$MODE" in
            test)    node web_legacy_emails/send_weekly.js --test $([ "${{ github.event_name }}" = "schedule" ] && echo --mark-sent) ;;
            dry-run) node web_legacy_emails/send_weekly.js --dry-run ;;
            send)    node web_legacy_emails/send_weekly.js --mark-sent ;;
            *)       echo "Unknown mode: $MODE (use test / dry-run / send)"; exit 1 ;;
          esac

      - name: Upload email preview (dry-run)
        if: steps.due.outputs.due == 'true' && success() && hashFiles('web_legacy_emails/last_scheduled_preview.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: email-preview
          path: web_legacy_emails/last_scheduled_preview.html
          retention-days: 14

      - name: Commit history and "sent today" marker
        if: steps.due.outputs.due == 'true' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web_legacy_emails/jira_weekly_history.json
          if [ -f web_legacy_emails/last_scheduled_send.json ]; then
            git add web_legacy_emails/last_scheduled_send.json
          fi
          if git diff --cached --quiet; then
            echo "Nothing to commit (manual test / dry-run)."
          else
            git commit -m "chore(web-legacy-emails): weekly summary sent $(date +%Y-%m-%d)"
            git push
          fi
